# e2e/configs/archive.yaml
# Archive job configuration for local E2E test
# Run: iceberg-archive archive --config e2e/configs/archive.yaml --no-dry-run

source_root: "s3a://warehouse/iceberg"
table: "tpch/orders"

archive_root: "s3a://warehouse/archive"

# Retention policy:
# Keep the 5 most-recent monthly snapshots on primary; archive everything older.
older_than: "150d"          # 5 months back from today's demo date
min_snapshots_to_keep: 5    # always keep at least 5 snapshots on primary
delete_after_archive: true  # expire archived snapshots from primary after copy

transfer:
  parallelism: 8

source_s3:
  endpoint: "http://localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  region: "us-east-1"

archive_s3:
  endpoint: "http://localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  region: "us-east-1"

catalog:
  nessie_uri: "http://localhost:19120"   # internal — only reachable in Docker net
  nessie_ref: "main"
  # OAuth credentials for catalog pointer update
  oauth_url: "http://localhost:8081/oauth2/token"
  oauth_client_id: "sync-service"
  oauth_client_secret: "sync-secret"
