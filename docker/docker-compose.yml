# docker/docker-compose.yml
#
# On-premises Iceberg catalog stack for catalog-sync POC
#
# Services
# ────────
#   nessie   — Nessie transactional catalog (Iceberg REST API + Nessie native API)
#   minio    — S3-compatible local object storage (stores Parquet + metadata)
#   mc-init  — One-shot container: creates the 'warehouse' bucket on first start
#
# Quick start
# ───────────
#   docker compose up -d
#   docker compose logs -f nessie          # watch startup
#
# Endpoints
# ─────────
#   Nessie REST catalog:  http://localhost:19120/iceberg/v1
#   Nessie UI / health:   http://localhost:19120/q/health
#   MinIO S3 API:         http://localhost:9000
#   MinIO console UI:     http://localhost:9001  (minioadmin / minioadmin)
#
# Spark config snippet (to verify tables after sync)
# ─────────────────────────────────────────────────
#   spark.sql.catalog.nessie                  = org.apache.iceberg.spark.SparkCatalog
#   spark.sql.catalog.nessie.catalog-impl     = org.apache.iceberg.nessie.NessieCatalog
#   spark.sql.catalog.nessie.uri              = http://localhost:19120/iceberg
#   spark.sql.catalog.nessie.ref              = main
#   spark.sql.catalog.nessie.warehouse        = s3a://warehouse/
#   spark.hadoop.fs.s3a.endpoint              = http://localhost:9000
#   spark.hadoop.fs.s3a.access.key            = minioadmin
#   spark.hadoop.fs.s3a.secret.key            = minioadmin
#   spark.hadoop.fs.s3a.path.style.access     = true

services:

  # ── Nessie transactional catalog ────────────────────────────────────────────
  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    ports:
      - "19120:19120"
    environment:
      # Version store: IN_MEMORY is fine for POC.
      # For persistence across restarts use:  NESSIE_VERSION_STORE_TYPE=ROCKSDB
      NESSIE_VERSION_STORE_TYPE: IN_MEMORY
      QUARKUS_LOG_LEVEL: WARN
      QUARKUS_HTTP_PORT: 19120
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:19120/q/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - iceberg-net

  # ── MinIO — on-prem S3-compatible object storage ─────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"    # S3 API — boto3 / spark.hadoop.fs.s3a.endpoint
      - "9001:9001"    # MinIO console  http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iceberg-net

  # ── One-shot: create the warehouse bucket ────────────────────────────────────
  mc-init:
    image: minio/mc:latest
    container_name: mc-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/warehouse &&
        echo '✓ MinIO bucket warehouse ready'
      "
    networks:
      - iceberg-net
    restart: "no"

volumes:
  minio-data:
    driver: local

networks:
  iceberg-net:
    driver: bridge
