# docker/docker-compose.yml
#
# Enterprise Iceberg catalog stack — OPA-enforced access control
#
# Services
# ────────
#   postgres         — PostgreSQL 15; databases: nessie, oauth, airflow
#   oauth-service    — OAuth 2.0 authorization server (RS256 JWT, OIDC discovery)
#   opa              — Open Policy Agent (Rego policies; replaces policy-service)
#   catalog-gateway  — Iceberg REST Catalog proxy (JWT validation + OPA enforcement)
#   nessie           — Nessie transactional Iceberg catalog (JDBC/PostgreSQL + JWT auth)
#   minio            — S3-compatible on-prem object storage
#   mc-init          — One-shot: creates the 'warehouse' bucket
#
# Enforcement model
# ─────────────────
#   Layer 1  Table access      OPA allow/deny → HTTP 403            (hard)
#   Layer 4  Column exclusion  Gateway schema rewrite                (hard)
#   Layer 2  Row filter        Injected into Iceberg scan filter     (hard)
#   Layer 3  Column masking    Table property; query engine applies  (advisory)
#
# IMPORTANT: nessie:19120 is bound only to the Docker network (no host port).
# All client traffic must go through catalog-gateway:8083.
# Exposing Nessie directly would bypass gateway enforcement.
#
# Quick start
# ───────────
#   docker compose up -d
#   docker compose logs -f catalog-gateway opa
#
# Endpoints (host-accessible)
# ────────────────────────────
#   OAuth service:       http://localhost:8081
#   Catalog Gateway:     http://localhost:8083   ← Iceberg REST Catalog for clients
#   OPA (admin):         http://localhost:8181
#   MinIO S3 API:        http://localhost:9000
#   MinIO console UI:    http://localhost:9001  (minioadmin / minioadmin)
#
# Default OAuth clients
# ─────────────────────
#   admin-client     / admin-secret      — unrestricted (catalog-gateway uses this)
#   sync-service     / sync-secret       — read + write all namespaces
#   analytics-client / analytics-secret  — gold read, EMEA rows only, PII masked
#   data-scientist   / ds-secret         — silver+bronze read, direct PII excluded

services:

  # ── PostgreSQL — shared datastore ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - iceberg-net

  # ── OAuth 2.0 Authorization Server ────────────────────────────────────────
  oauth-service:
    build:
      context: ../oauth_service
      dockerfile: Dockerfile
    container_name: oauth-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://oauth:oauth@postgres:5432/oauth
      ISSUER: http://oauth-service:8081
      ADMIN_TOKEN: admin-secret-change-me
      ACCESS_TOKEN_EXPIRE_SECONDS: "3600"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - iceberg-net

  # ── Open Policy Agent — Rego-based access control ─────────────────────────
  # Policies live in opa/policies/iceberg.rego (hot-reloaded from the volume).
  # OPA is NOT exposed on a host port in production — only catalog-gateway
  # talks to it internally. The 8181 host port is for local policy development.
  opa:
    image: openpolicyagent/opa:latest-rootless
    container_name: opa
    ports:
      - "8181:8181"
    volumes:
      - ../opa/policies:/policies:ro
    command:
      - run
      - --server
      - --addr
      - 0.0.0.0:8181
      - --log-level
      - warn
      - /policies
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iceberg-net

  # ── Catalog Gateway — Iceberg REST Catalog proxy with OPA enforcement ─────
  catalog-gateway:
    build:
      context: ../catalog_gateway
      dockerfile: Dockerfile
    container_name: catalog-gateway
    ports:
      - "8083:8083"
    environment:
      NESSIE_URL: http://nessie:19120/iceberg/v1
      OPA_URL: http://opa:8181
      OAUTH_URL: http://oauth-service:8081
      JWKS_URI: http://oauth-service:8081/.well-known/jwks.json
      GATEWAY_CLIENT_ID: admin-client
      GATEWAY_CLIENT_SECRET: admin-secret
      ISSUER: http://oauth-service:8081
    depends_on:
      nessie:
        condition: service_healthy
      opa:
        condition: service_healthy
      oauth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - iceberg-net

  # ── Nessie transactional catalog ──────────────────────────────────────────
  # NOTE: No host port binding — accessible only from within iceberg-net.
  # All client access must go through catalog-gateway:8083.
  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    # Port 19120 is intentionally NOT exposed to the host.
    # Clients must use catalog-gateway:8083 (enforcement point).
    expose:
      - "19120"
    environment:
      # PostgreSQL version store (persistent across restarts)
      NESSIE_VERSION_STORE_TYPE: JDBC
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: nessie
      QUARKUS_DATASOURCE_PASSWORD: nessie
      # JWT authentication — validates tokens from oauth-service
      NESSIE_SERVER_AUTHENTICATION_ENABLED: "true"
      QUARKUS_OIDC_AUTH_SERVER_URL: http://oauth-service:8081
      QUARKUS_OIDC_CLIENT_ID: nessie-server
      QUARKUS_OIDC_APPLICATION_TYPE: SERVICE
      QUARKUS_OIDC_TOKEN_ISSUER: http://oauth-service:8081
      QUARKUS_LOG_LEVEL: WARN
      QUARKUS_HTTP_PORT: 19120
    depends_on:
      postgres:
        condition: service_healthy
      oauth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:19120/q/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - iceberg-net

  # ── MinIO — on-prem S3-compatible object storage ──────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iceberg-net

  # ── One-shot: create the warehouse bucket ─────────────────────────────────
  mc-init:
    image: minio/mc:latest
    container_name: mc-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/warehouse &&
        echo 'MinIO bucket warehouse ready'
      "
    networks:
      - iceberg-net
    restart: "no"

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local

networks:
  iceberg-net:
    driver: bridge
